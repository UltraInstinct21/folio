name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # all four build jobs run in parallel; without a pre-existing draft each
  # one races to create it and you get duplicate draft releases
  draft:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: create the shared draft release
        run: >
          gh release create "$GITHUB_REF_NAME" --draft
          --title "folio v${GITHUB_REF_NAME#v}"
          --notes "Installers for Linux, Windows and macOS." || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: draft
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend deps
        run: npm install

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: __VERSION__
          releaseName: "folio v__VERSION__"
          releaseBody: "Draft release: installers for Linux, Windows and macOS."
          releaseDraft: true
          args: ${{ matrix.args }}
